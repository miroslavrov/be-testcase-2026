services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: .
    command: migrate
    environment:
      DATABASE_URL: postgres://agenthub:agenthub@postgres:5432/agenthub?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://agenthub:agenthub@postgres:5432/agenthub?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: worker
    environment:
      DATABASE_URL: postgres://agenthub:agenthub@postgres:5432/agenthub?sslmode=disable
      WORKER_CONCURRENCY: 2
    healthcheck:
      test: ["CMD", "pgrep", "worker"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
